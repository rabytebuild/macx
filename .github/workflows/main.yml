name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Create User Account with Home Directory
        run: |
          sudo sysadminctl -addUser runneradmin -password "Rabiu2004@" -admin
          sudo mkdir -p /Users/runneradmin
          sudo chown -R runneradmin:staff /Users/runneradmin
          sudo chmod 700 /Users/runneradmin
          sudo dseditgroup -o edit -a runneradmin -t user admin || true
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' | sudo tee /Users/runneradmin/.zprofile > /dev/null
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' | sudo tee /Users/runneradmin/.bash_profile > /dev/null
        shell: bash

      - name: Enable and Start SSH
        run: |
          sudo systemsetup -setremotelogin on
          sudo launchctl kickstart -k system/com.openssh.sshd || true
        shell: bash

      - name: Download ngrok
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            curl -Lo ngrok.zip "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-arm64.zip"
          else
            curl -Lo ngrok.zip "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-amd64.zip"
          fi
        shell: bash

      - name: Extract ngrok
        run: |
          sudo unzip -o ngrok.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/ngrok
        shell: bash

      - name: Authenticate ngrok
        run: ngrok config add-authtoken 3IwjZMmce2fmYCdcKyESHjYpqtT_6YHmkqJj7p8bCkssB8EzE
        shell: bash

      - name: Start ngrok and Show Tunnel URL
        run: |
          nohup ngrok tcp 22 > /dev/null 2>&1 &
          sleep 5
          echo "========================================"
          echo "NGROK TUNNEL URL:"
          curl -s http://localhost:4040/api/tunnels | python3 -c "import sys,json; [print('SSH:',t['public_url']) for t in json.load(sys.stdin).get('tunnels',[])]"
          echo "========================================"
        shell: bash

      - name: Install essential tools via Homebrew
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew update
          brew install --cask stats
          brew install wget curl
        shell: bash

      - name: Fix Homebrew permissions for runneradmin
        run: sudo chown -R runneradmin:staff /opt/homebrew
        shell: bash

      - name: Keep Runner Alive
        run: |
          echo "Runner is active. Keeping alive for 6 hours..."
          echo "SSH User: runneradmin"
          echo "Password: Rabiu2004@"
          sleep 21600
        shell: bash
