name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Create User Account with Home Directory
        run: |
          # Create user with dscl (reliable in non-interactive environments)
          sudo dscl . -create /Users/rhsalisu
          sudo dscl . -create /Users/rhsalisu UserShell /bin/zsh
          sudo dscl . -create /Users/rhsalisu RealName "Runner Admin"
          sudo dscl . -create /Users/rhsalisu UniqueID 502
          sudo dscl . -create /Users/rhsalisu PrimaryGroupID 20
          sudo dscl . -create /Users/rhsalisu NFSHomeDirectory /Users/rhsalisu
          sudo dscl . -passwd /Users/rhsalisu "R@b1u2004@"
          
          # Create and secure home directory
          sudo mkdir -p /Users/rhsalisu
          sudo chown -R rhsalisu:staff /Users/rhsalisu
          sudo chmod 700 /Users/rhsalisu
          
          # Add to admin group
          sudo dseditgroup -o edit -a rhsalisu -t user admin || true
          
          # Setup shell profiles for Homebrew
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' | sudo tee /Users/rhsalisu/.zprofile > /dev/null
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' | sudo tee /Users/rhsalisu/.bash_profile > /dev/null
        shell: bash

      - name: Enable and Start SSH
        run: |
          sudo systemsetup -setremotelogin on
          sudo launchctl kickstart -k system/com.openssh.sshd || true
        shell: bash

      - name: Download ngrok
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            curl -Lo ngrok.zip "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-arm64.zip"
          else
            curl -Lo ngrok.zip "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-amd64.zip"
          fi
        shell: bash

      - name: Extract ngrok
        run: |
          sudo unzip -o ngrok.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/ngrok
        shell: bash

      - name: Authenticate ngrok
        run: ngrok config add-authtoken 3IwjZMmce2fmYCdcKyESHjYpqtT_6YHmkqJj7p8bCkssB8EzE
        shell: bash

      - name: Start ngrok and Show Tunnel URL
        run: |
          nohup ngrok tcp 22 > /dev/null 2>&1 &
          sleep 5
          echo "========================================"
          echo "NGROK TUNNEL URL:"
          curl -s http://localhost:4040/api/tunnels | python3 -c "import sys,json; [print('SSH:',t['public_url']) for t in json.load(sys.stdin).get('tunnels',[])]"
          echo "========================================"
        shell: bash

      - name: Install essential tools via Homebrew
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew update
          brew install wget curl
        shell: bash

      - name: Fix Homebrew permissions for rhsalisu
        run: sudo chown -R rhsalisu:staff /opt/homebrew
        shell: bash

      - name: Keep Runner Alive
        run: |
          echo "Runner is active. Keeping alive for 6 hours..."
          echo "SSH User: rhsalisu"
          echo "Password: R@b1u2004@"
          sleep 21600
        shell: bash
